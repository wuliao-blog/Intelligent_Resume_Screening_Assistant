server.port=8899
spring.application.name=SpringAI_IRSA

# ===================== DashScope（阿里云百炼）=====================
# 不要把真实 Key 写进仓库！通过环境变量 DASHSCOPE_API_KEY 注入
# Windows PowerShell:  $env:DASHSCOPE_API_KEY="sk-xxxx"
# Linux / macOS:       export DASHSCOPE_API_KEY=sk-xxxx
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY:}

# 对话模型（生成）
spring.ai.dashscope.chat.options.model=qwen-max
# 向量模型（RAG 检索用，必须与写入向量库时保持一致）
spring.ai.dashscope.embedding.options.model=text-embedding-v2

# ===================== RAG 知识库 =====================
# 简历文档位置，支持 classpath: 与 file: 前缀
app.rag.resume-path=classpath:张三简历.txt
# 分块大小（token）
app.rag.chunk-size=1200
# 每块最少字符数
app.rag.min-chunk-size-chars=350
# 丢弃低于该长度的块
app.rag.min-chunk-length-to-embed=5
# 最大分块数量
app.rag.max-num-chunks=100
# 检索返回的片段条数
app.rag.top-k=3
